name: Greenlight
options:
  bundleIdPrefix: uk.lbsi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Greenlight:
    type: application
    platform: macOS
    sources:
      - Greenlight
      - path: skill/SKILL.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Greenlight
        PRODUCT_BUNDLE_IDENTIFIER: uk.lbsi.Greenlight
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Greenlight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 LBSi UK / Leon Brahams"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GreenlightTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GreenlightTests
      - Greenlight/Core
      - Greenlight/CLI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Greenlight:
    build:
      targets:
        Greenlight: all
        GreenlightTests: [test]
    test:
      targets: [GreenlightTests]
